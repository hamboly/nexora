<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <base href="/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora</title>
  <meta name="description" content="Nexora — your personal widget dashboard with live data." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="nature-backdrop" aria-hidden="true"></div>
  <div class="nature-scrim" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo">N</span>
        <span class="brand-name">Nexora</span>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <button class="new-cat-btn" id="newCatBtn"><span>＋</span><span>New Category</span></button>
      <button class="collapse-btn" id="collapseBtn" title="Collapse/expand sidebar">«</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="categoryTitle"></h1>
        <p class="hint" id="categoryHint"></p>
        <button class="add-widget-btn" id="addWidgetBtn">＋ Add Widget</button>
        <button class="icon-btn" id="styleBtn" title="UI style">🎨</button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
        <button class="icon-btn" id="resetBtn" title="Reset layout for this page">↺</button>
      </header>
      <div class="layout-tools">
        <p id="layoutHelp">Drag widgets anywhere · Resize from the bottom-right corner</p>
        <button id="undoLayoutBtn" type="button" disabled>Undo layout</button>
        <button id="arrangeWidgetsBtn" type="button">Auto arrange</button>
      </div>
      <section class="widget-grid" id="widgetGrid" aria-describedby="layoutHelp"></section>
    </main>
  </div>

  <div id="modalRoot"></div>

  <script src="tests/fixtures.js"></script>
  <script src="widget-layout.js"></script>
  <script src="widget-canvas.js"></script>
  <script src="alarm-clock.js"></script><script src="app.js"></script>
  <script src="tests/widget-canvas.js"></script>
  
</body>
</html>
